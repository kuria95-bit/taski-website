<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TASKI | Create Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:430px;background:#1b1b1b;border:1px solid #514218;border-radius:16px;padding:28px}.logo{color:#ffc928;font-size:28px;font-weight:900;letter-spacing:2px;text-decoration:none}.eyebrow{color:#ffc928;font-size:11px;font-weight:800;letter-spacing:2px;margin-top:28px}h1{font-size:27px;margin:8px 0}p{color:#aaa;font-size:13px;line-height:1.6}label{display:block;font-size:12px;font-weight:bold;margin:17px 0 7px}input{width:100%;padding:14px;border-radius:8px;border:1px solid #444;background:#101010;color:white;font-size:15px}.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:8px;background:#ffc928;color:#111;font-weight:900;font-size:14px}.msg{min-height:40px;color:#f5d978;font-size:13px;margin-top:15px;line-height:1.5}.back{display:block;text-align:center;margin-top:18px;color:#ffc928;font-size:13px;text-decoration:none}</style></head><body><main class="card"><a class="logo" href="index.html">TASKI.</a><div class="eyebrow">MEMBER REGISTRATION</div><h1>Create your account</h1><p>Register with your email and create a password to join the TASKI member area.</p><form id="signupForm"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><button class="btn" id="signupBtn" type="submit">CREATE ACCOUNT</button></form><div class="msg" id="message" role="status"></div><a class="back" href="dashboard.html">Already have an account? Log in</a></main><script>const SUPABASE_URL="https://rggzettkkhcioxfpjekj.supabase.co";const SUPABASE_KEY="sb_publishable_uQwUGngD9JKIRlaNMd0Tfw_7-KjUaL3";const message=document.getElementById("message");const form=document.getElementById("signupForm");const button=document.getElementById("signupBtn");if(!window.supabase){message.textContent="The account service did not load. Please refresh and try again.";}else{const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);form.addEventListener("submit",async function(event){event.preventDefault();message.textContent="Creating your account...";button.disabled=true;const email=document.getElementById("email").value.trim();const password=document.getElementById("password").value;try{const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:"https://kuria95-bit.github.io/taski-website/dashboard.html"}});if(error){message.textContent=error.message;return;}message.textContent=data.session?"Your account is created and you are signed in.":"Your account is created. Please check your email for a confirmation link, then log in.";if(data.session){setTimeout(()=>window.location.href="dashboard.html",1200);}}catch(error){message.textContent="Something went wrong: "+error.message;}finally{button.disabled=false;}});}</script></body></html>
