<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TASKI | Reset Password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#101010;color:#fff;font-family:Arial,sans-serif}.card{width:100%;max-width:430px;padding:28px;background:#1b1b1b;border:1px solid #514218;border-radius:16px}.logo{color:#ffc928;font-size:28px;font-weight:900;letter-spacing:2px;text-decoration:none}.eyebrow{color:#ffc928;font-size:11px;font-weight:800;letter-spacing:2px;margin-top:28px}h1{font-size:27px;margin:8px 0}p{color:#aaa;font-size:13px;line-height:1.6}label{display:block;font-size:12px;font-weight:bold;margin:17px 0 7px}.pw{display:flex;gap:8px}.pw input{flex:1;min-width:0}input{width:100%;padding:14px;border-radius:8px;border:1px solid #444;background:#101010;color:white;font-size:15px}.toggle{background:#292929;border:1px solid #555;color:#ffc928;border-radius:8px;padding:0 12px;font-size:11px;font-weight:800}.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:8px;background:#ffc928;color:#111;font-weight:900;font-size:14px}.msg{min-height:40px;color:#f5d978;font-size:13px;margin-top:15px;line-height:1.5}.back{display:block;text-align:center;margin-top:18px;color:#ffc928;font-size:13px;text-decoration:none}</style></head>
<body><main class="card"><a class="logo" href="index.html">TASKI.</a><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Choose a new password</h1><p>Enter your new password below. Use at least 8 characters.</p>
<form id="resetForm"><label for="password">NEW PASSWORD</label><div class="pw"><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required><button class="toggle" type="button" data-target="password">SHOW</button></div>
<label for="confirmPassword">CONFIRM NEW PASSWORD</label><div class="pw"><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Enter password again" required><button class="toggle" type="button" data-target="confirmPassword">SHOW</button></div>
<button class="btn" type="submit">SAVE NEW PASSWORD</button></form><div class="msg" id="message" role="status">Open this page using the password reset link sent to your email.</div><a class="back" href="dashboard.html">Back to TASKI login</a></main>
<script>
const SUPABASE_URL="https://rggzettkkhcioxfpjekj.supabase.co";const SUPABASE_KEY="sb_publishable_uQwUGngD9JKIRlaNMd0Tfw_7-KjUaL3";const client=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;const message=document.getElementById("message");
document.querySelectorAll(".toggle").forEach(b=>b.addEventListener("click",()=>{const p=document.getElementById(b.dataset.target);p.type=p.type==="password"?"text":"password";b.textContent=p.type==="password"?"SHOW":"HIDE";}));
if(client){client.auth.getSession().then(({data,error})=>{if(error)message.textContent=error.message;else if(!data.session)message.textContent="This reset link may have expired or already been used. Request a new one from the login page.";else message.textContent="Reset link verified. Choose your new password.";});client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)message.textContent="Reset link verified. Choose your new password.";});}else{message.textContent="Account service did not load. Refresh and try again.";}
document.getElementById("resetForm").addEventListener("submit",async e=>{e.preventDefault();if(!client){message.textContent="Account service is unavailable.";return;}const password=document.getElementById("password").value,confirm=document.getElementById("confirmPassword").value;if(password.length<8){message.textContent="Password must be at least 8 characters.";return;}if(password!==confirm){message.textContent="The passwords do not match.";return;}message.textContent="Updating your password...";const {error}=await client.auth.updateUser({password});if(error){message.textContent=error.message;return;}message.textContent="Password updated successfully. You can now log in with your new password.";document.getElementById("resetForm").reset();});
</script></body></html>
